name: Merge validated timezone updates

on:
  workflow_run:
    workflows: [Validate pull requests]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Completed CI run to inspect
        type: string
        required: true
      dry_run:
        description: Verify merge eligibility without approving workflows, merging or deploying
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: timezone-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/timezone-')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install trusted dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Merge only a verified timezone data commit and publish Pages
        env:
          GH_TOKEN: ${{ github.token }}
          TZ_MERGE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/merge-timezone-update.mjs
